<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Watchlist</title>
<style>
  :root { --bg: #190e13; --card: #2a1820; --ink: #f6ecdc; --muted: #b59d9a; --gold: #f4c542; --red: #b3202f; --line: #4a2b35; --ok: #7bd389; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  .curtain { height: 14px; background: repeating-linear-gradient(90deg, #8f1826 0 26px, #b3202f 26px 52px); }
  main { max-width: 660px; margin: 0 auto; padding: 22px 16px 48px; }
  h1 { font: 800 34px/1.1 Georgia, serif; margin: 0; color: var(--gold); letter-spacing: .02em; } .sub { color: var(--muted); margin: 2px 0 10px; }
  #status { font-size: 13px; color: var(--muted); margin: 0 0 12px; } #status.ok { color: var(--ok); } #status.err { color: #ff8a80; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font: 700 19px Georgia, serif; margin: 0 0 8px; color: var(--gold); }
  input, select { font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: #150b10; color: var(--ink); min-width: 0; }
  input::placeholder { color: #86706f; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  button { font: inherit; font-weight: 700; padding: 9px 16px; border: 0; border-radius: 10px; background: var(--gold); color: #2a1a00; cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 5px 12px; font-size: 14px; } button.ghost:hover { border-color: var(--gold); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; } .row > input { flex: 1 1 140px; } .grow { flex: 2 1 220px !important; }
  .tabs { display: flex; gap: 6px; margin: 14px 0 10px; flex-wrap: wrap; } .tabs button { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .tabs button.on { background: var(--red); border-color: var(--red); } .tabs input { flex: 1; min-width: 120px; margin-left: auto; }
  .movie { background: var(--card); border: 1px solid var(--line); border-left: 6px dashed var(--red); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; }
  .movie.done { border-left-color: var(--ok); opacity: .92; }
  .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; } .name { font: 700 19px Georgia, serif; } .year { color: var(--muted); }
  .tag { margin-left: auto; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; background: #3d222c; color: var(--gold); padding: 2px 10px; border-radius: 99px; }
  .notes { color: #d9c7c2; margin: 4px 0 8px; font-size: 15px; } .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .stars button { background: none; color: var(--gold); border: 0; padding: 0 2px; font-size: 22px; line-height: 1; } .when { color: var(--muted); font-size: 13px; }
  .empty { text-align: center; color: var(--muted); padding: 22px 0; } #picksNote { color: var(--muted); font-size: 14px; margin: 8px 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="curtain"></div>
<main>
  <h1>Movie Watchlist</h1>
  <p class="sub">Add movies, tick them off, and ask what to watch tonight.</p>
  <p id="status">Checking the movie-matching model...</p>

  <section class="panel">
    <h2>What should I watch tonight?</h2>
    <div class="row"><input id="mood" class="grow" placeholder="Describe the mood: something funny for the whole family" maxlength="200" aria-label="Mood">
      <button id="pickBtn" disabled>Find my pick</button></div>
    <div id="picksNote"></div><div id="picks"></div>
  </section>

  <section class="panel">
    <h2>Add a movie</h2>
    <div class="row">
      <input id="title" class="grow" placeholder="Title" maxlength="100" aria-label="Title">
      <input id="year" type="number" min="1888" max="2100" placeholder="Year" style="max-width:90px" aria-label="Year">
      <select id="genre" aria-label="Genre"><option value="">Genre</option><option>Action</option><option>Animation</option><option>Comedy</option><option>Documentary</option><option>Drama</option><option>Horror</option><option>Romance</option><option>Sci-Fi</option><option>Thriller</option><option>Other</option></select>
    </div>
    <div class="row" style="margin-top:8px"><input id="notes" class="grow" placeholder="Why do you want to watch it? (helps the matching)" maxlength="160" aria-label="Notes"><button id="addBtn">Add</button></div>
  </section>

  <div class="tabs" id="tabs">
    <button data-t="todo" class="on"></button><button data-t="done"></button><button data-t="all"></button>
    <input id="filter" type="search" placeholder="Filter by title..." aria-label="Filter by title">
  </div>
  <div id="list"></div>
  <div class="row" style="margin-top:12px"><button class="ghost" id="sampleBtn">Add sample movies</button><button class="ghost" id="exportBtn">Download my list</button></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let movies = [];
try { movies = JSON.parse(localStorage.getItem("movies") || "[]"); } catch {}
const persist = () => { try { localStorage.setItem("movies", JSON.stringify(movies)); } catch {} };
let tab = "todo", ready = false, picks = [], picksLabel = "";
const today = () => new Date().toISOString().slice(0, 10);
const movieText = (m) => m.title + (m.year ? " (" + m.year + ")" : "") + ". " + (m.genre ? "Genre: " + m.genre + ". " : "") + m.notes;

// ---------- Movie cards ----------
function card(m) {
  const d = document.createElement("div"); d.className = "movie" + (m.watched ? " done" : "");
  const top = document.createElement("div"); top.className = "top";
  const name = document.createElement("span"); name.className = "name"; name.textContent = m.title; top.append(name);
  if (m.year) { const y = document.createElement("span"); y.className = "year"; y.textContent = "(" + m.year + ")"; top.append(y); }
  if (m.genre) { const g = document.createElement("span"); g.className = "tag"; g.textContent = m.genre; top.append(g); }
  d.append(top);
  if (m.notes) { const n = document.createElement("div"); n.className = "notes"; n.textContent = m.notes; d.append(n); }

  const acts = document.createElement("div"); acts.className = "acts";
  const btn = (label, fn, cls = "ghost") => { const b = document.createElement("button"); b.className = cls; b.textContent = label; b.onclick = fn; return b; };
  if (!m.watched) acts.append(btn("Mark watched", () => { m.watched = true; m.date = today(); save(); }, ""));
  else {
    const stars = document.createElement("span"); stars.className = "stars";
    for (let i = 1; i <= 5; i++) { const s = document.createElement("button"); s.textContent = i <= m.rating ? "\u2605" : "\u2606"; s.setAttribute("aria-label", i + " star" + (i > 1 ? "s" : "")); s.onclick = () => { m.rating = m.rating === i ? 0 : i; save(); }; stars.append(s); }
    const w = document.createElement("span"); w.className = "when"; w.textContent = "Watched " + (m.date || "");
    acts.append(stars, w, btn("Move back", () => { m.watched = false; m.rating = 0; save(); }));
  }
  const sim = btn("Find similar", () => findSimilar(m)); sim.classList.add("sim"); sim.disabled = !ready;
  acts.append(sim, btn("Delete", () => { if (confirm("Remove " + m.title + "?")) { movies = movies.filter((x) => x !== m); save(); } }));
  d.append(acts); return d;
}
function save() { persist(); render(); }

function render() {
  const todo = movies.filter((m) => !m.watched), done = movies.filter((m) => m.watched);
  const labels = { todo: "To watch (" + todo.length + ")", done: "Watched (" + done.length + ")", all: "All (" + movies.length + ")" };
  document.querySelectorAll("#tabs button").forEach((b) => { b.textContent = labels[b.dataset.t]; b.classList.toggle("on", b.dataset.t === tab); });
  const q = $("filter").value.trim().toLowerCase();
  const shown = (tab === "todo" ? todo : tab === "done" ? done : movies).filter((m) => !q || m.title.toLowerCase().includes(q));
  const box = $("list"); box.innerHTML = "";
  if (!shown.length) box.innerHTML = '<p class="empty">' + (movies.length ? "Nothing here." : "Your watchlist is empty. Add a movie above, or try the samples!") + "</p>";
  [...shown].reverse().forEach((m) => box.append(card(m)));
  renderPicks();
}
$("tabs").onclick = (e) => { if (e.target.dataset.t) { tab = e.target.dataset.t; render(); } };
$("filter").oninput = render;

// ---------- Add ----------
function add() {
  const title = $("title").value.trim(); if (!title) return $("title").focus();
  movies.push({ id: String(Date.now()) + Math.random().toString(36).slice(2, 5), title, year: $("year").value, genre: $("genre").value, notes: $("notes").value.trim(), watched: false, rating: 0, date: null });
  ["title", "year", "notes"].forEach((id) => ($(id).value = "")); $("genre").value = ""; tab = "todo"; save(); $("title").focus();
}
$("addBtn").onclick = add; ["title", "notes"].forEach((id) => ($(id).onkeydown = (e) => e.key === "Enter" && add()));

// ---------- Matching with QVAC embeddings (on your machine) ----------
async function rank(query, pool, keywords) {
  const res = await fetch("/api/rank", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, keywords, limit: 3, items: pool.map((m) => ({ id: m.id, text: movieText(m) })) }) });
  if (!res.ok) throw new Error((await res.json()).error || "failed"); return (await res.json()).map((r) => r.id);
}
function renderPicks() {
  const box = $("picks"); box.innerHTML = ""; $("picksNote").textContent = picks.length ? picksLabel : $("picksNote").dataset.msg || "";
  picks.map((id) => movies.find((m) => m.id === id)).filter(Boolean).forEach((m) => box.append(card(m)));
}
async function runPicks(label, query, pool, keywords) {
  if (!pool.length) { picks = []; $("picksNote").dataset.msg = "Nothing to choose from yet. Add some movies first."; return render(); }
  $("picksNote").dataset.msg = "Thinking..."; picks = []; renderPicks(); $("pickBtn").disabled = true;
  try { picks = await rank(query, pool, keywords); picksLabel = label; $("picksNote").dataset.msg = ""; }
  catch (err) { $("picksNote").dataset.msg = "Couldn't match right now: " + err.message; }
  $("pickBtn").disabled = !ready; render();
}
$("pickBtn").onclick = () => { const mood = $("mood").value.trim(); if (!mood) return $("mood").focus(); runPicks("Best matches for \"" + mood + "\" from your to-watch list:", mood, movies.filter((m) => !m.watched), true); };
$("mood").onkeydown = (e) => e.key === "Enter" && !$("pickBtn").disabled && $("pickBtn").click();
function findSimilar(m) { runPicks("Movies in your list similar to " + m.title + ":", movieText(m), movies.filter((x) => x !== m), false); window.scrollTo(0, 0); }

// ---------- Extras ----------
$("sampleBtn").onclick = () => {
  const S = [["Spirited Away", 2001, "Animation", "Beautiful, magical adventure with spirits and a bathhouse", 0],
    ["Parasite", 2019, "Thriller", "Dark comedy about two families and class", 0], ["Inception", 2010, "Sci-Fi", "Mind-bending heist inside dreams", 0],
    ["The Grand Budapest Hotel", 2014, "Comedy", "Quirky, colorful and funny", 0], ["Get Out", 2017, "Horror", "Tense and scary, with a clever twist", 0],
    ["Paddington 2", 2017, "Comedy", "Wholesome and sweet, great for the whole family", 0], ["Toy Story", 1995, "Animation", "Classic about toys that come alive", 5]];
  S.forEach(([title, year, genre, notes, rating], i) => movies.push({ id: "s" + Date.now() + i, title, year, genre, notes, watched: !!rating, rating, date: rating ? today() : null }));
  save();
};
$("exportBtn").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(movies, null, 2)], { type: "application/json" })); a.download = "my-watchlist.json"; a.click(); };

// ---------- Model status ----------
async function checkStatus() {
  try {
    const s = await (await fetch("/api/status")).json();
    if (s.error) return setStatus("Matching error: " + s.error + ". The watchlist still works.", "err");
    if (s.ready) { ready = true; $("pickBtn").disabled = false; document.querySelectorAll(".sim").forEach((b) => (b.disabled = false)); return setStatus("Movie matching ready. It runs on your device.", "ok"); }
    setStatus(s.message + (s.percent != null ? " " + s.percent + "%" : "") + " The watchlist works meanwhile.");
  } catch { setStatus("Can't reach the server. Is it running?", "err"); }
  setTimeout(checkStatus, 1500);
}
function setStatus(t, c = "") { $("status").textContent = t; $("status").className = c; }

render(); checkStatus();
</script>
</body>
</html>
